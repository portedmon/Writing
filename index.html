<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Command Terms Writing Drill — IB MYP 5 to DP</title>
  <meta name="description" content="Daily 15-minute high-density evidence-based academic writing drill worksheets for IB MYP 5 students.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">
  <!-- Minimalist Top Bar (Hidden in Print) -->
  <header class="app-header no-print">
    <div class="header-inner">
      <div class="day-controls">
        <button class="nav-arrow-btn" id="prevDayBtn" title="Previous Day">
          <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="day-title-wrap">
          <span class="day-badge" id="currentDayBadge">Day 1</span>
          <span class="day-date" id="currentDateLabel">2026-10-31</span>
        </div>
        <button class="nav-arrow-btn" id="nextDayBtn" title="Next Day">
          <svg class="icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button class="today-btn" id="todayJumpBtn">Today</button>
      </div>

      <div class="header-actions">
        <!-- 15-min Practice Timer -->
        <div class="timer-chip" id="timerWidget">
          <span class="timer-time" id="timerDisplay">15:00</span>
          <button class="timer-action-btn" id="timerToggleBtn" title="Start/Pause 15-min timer">
            <svg class="icon play-icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <svg class="icon pause-icon hidden" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </button>
          <button class="timer-action-btn" id="timerResetBtn" title="Reset timer">
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
        </div>

        <!-- One-Click Print Button (A4 1 Sheet) -->
        <button class="print-main-btn" id="printDayBtn" title="Print this day's 2 drills onto 1 clean A4 page">
          <svg class="icon" viewBox="0 0 24 24"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          <span>Print A4 Drill Sheet</span>
        </button>

        <!-- Theme Switcher -->
        <button class="icon-toggle-btn" id="themeToggleBtn" title="Toggle Dark/Light Mode">
          <svg class="icon sun-icon hidden" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="page-container" id="pageContainer">
    <div class="drills-container" id="drillsContainer">
      <!-- High-density drills dynamically rendered here -->
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Loading Daily Writing Drills...</p>
      </div>
    </div>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden">Copied to clipboard!</div>

  <!-- Scripts -->
  <script src="app.js"></script>
</body>
</html>
