name: Daily IB Writing Generator & Deploy

on:
  schedule:
    # Runs every day at 00:00 UTC (09:00 JST)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_day:
        description: 'Optional: Force specific Day number to generate'
        required: false
        type: string

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages & push commits
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Daily Prompts via Gemini API (gemini-3.8-flash)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          FORCE_ARG=""
          if [ -n "${{ github.event.inputs.force_day }}" ]; then
            FORCE_ARG="--force-day ${{ github.event.inputs.force_day }}"
          fi
          python scripts/generate_daily.py $FORCE_ARG

      - name: Commit & Push updated prompts.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prompts.json
          if git status --porcelain | grep data/prompts.json; then
            git commit -m "Auto-generate Daily IB Writing Prompts (Gemini 3.8 Flash) [skip ci]"
            git push origin main || git push origin master
          else
            echo "No changes detected in data/prompts.json"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
